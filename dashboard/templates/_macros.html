{% macro sev(s) -%}
<span class="sev sev-{{ s }}"><i aria-hidden="true"></i>{{ SEVERITY_LABEL[s] }}</span>
{%- endmacro %}

{% macro empty(title, body, href=none, cta=none) -%}
<div class="empty">
  <p class="empty-title">{{ title }}</p>
  <p>{{ body }}</p>
  {% if href %}<a class="btn" href="{{ href }}">{{ cta }}</a>{% endif %}
</div>
{%- endmacro %}
